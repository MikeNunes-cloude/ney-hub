<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ney Hub · Comunicação</title>
<meta name="theme-color" content="#041A17">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#041A17; --surface:rgba(255,255,255,.055); --surface-2:rgba(255,255,255,.035); --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.16);
  --solid:#0A2622; --solid-2:#0E302B;
  --text:#ECF8F4; --muted:rgba(236,248,244,.62); --faint:rgba(236,248,244,.36);
  --primary:#34E3B8; --primary-600:#22C9A1; --primary-700:#8FF3D9; --primary-50:rgba(52,227,184,.12); --primary-100:rgba(52,227,184,.24);
  --on-primary:#03201A;
  --coral:#FF8A72; --coral-50:rgba(255,138,114,.14); --amber:#F2C14E; --amber-50:rgba(242,193,78,.14);
  --indigo:#9AA8FF; --indigo-50:rgba(154,168,255,.14); --danger:#FF6B6B; --danger-50:rgba(255,107,107,.12);
  --radius:20px; --radius-sm:12px;
  --glass:linear-gradient(160deg,rgba(255,255,255,.085),rgba(255,255,255,.025));
  --glass-border:rgba(255,255,255,.11);
  --blur:blur(22px) saturate(140%);
  --shadow:inset 0 1px 0 rgba(255,255,255,.07),0 12px 32px rgba(0,0,0,.28);
  --shadow-lg:0 30px 80px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary-600)}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Layout */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.app>div{min-width:0}
.side{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 20px}
.brand-mark{width:36px;height:36px;display:block;flex:none}
.brand-mark svg{width:18px;height:18px}
.brand b{display:block;font-size:15px;letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:12px}
.nav-a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:500;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.nav-a:hover{background:var(--surface-2);color:var(--text)}
.nav-a.on{background:var(--primary-50);color:var(--primary-700)}
.nav-a .badge{margin-left:auto}
.side-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line)}
.eu{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px;font-weight:500}
.eu span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bell{position:relative}
.bell b[hidden]{display:none}
.bell b{position:absolute;top:2px;right:2px;min-width:16px;height:16px;border-radius:99px;background:var(--coral);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}
.act{display:flex;gap:10px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.act:first-child{border-top:0}
.act.novo .t::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--coral);margin-right:6px;vertical-align:1px}
.act .t{font-size:13.5px}
.act .s{font-size:12px;color:var(--muted)}
.eu-op{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.sync{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.sync.on i{background:var(--primary)}
main{padding:28px 34px 60px;min-width:0;max-width:1320px;width:100%}
.mobile-top,.mobile-nav{display:none}

/* Headings */
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-h h1{margin:0;font-size:24px;letter-spacing:-.02em;font-weight:700}
.eyebrow{margin:0 0 2px;color:var(--muted);font-size:13px}
.eyebrow::first-letter,.daypanel h3::first-letter{text-transform:uppercase}
.h-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
h2{font-size:15px;margin:0;letter-spacing:-.01em}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--text)}
.btn:hover{border-color:var(--primary);color:var(--primary-700)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-600);color:#fff}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--primary-50)}
.btn.sm{height:30px;padding:0 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--danger)} .btn.danger:hover{border-color:var(--danger);background:var(--danger-50)}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;border:0;background:none;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:var(--primary-50);color:var(--primary-700)}
.icon-btn.sm{width:28px;height:28px}

/* Surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);cursor:default}
.kpi[data-act]{cursor:pointer}
.kpi .l{color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:6px}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.kpi .d{font-size:12px;color:var(--muted)}
.up{color:var(--primary-600)} .down{color:var(--danger)}
.empty{padding:22px 10px;text-align:center;color:var(--faint);font-size:13px}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.t-feriado{background:var(--coral-50);color:var(--coral);border-color:transparent}
.t-municipal{background:var(--primary-700);color:#fff;border-color:transparent}
.t-local{background:var(--indigo-50);color:var(--indigo);border-color:transparent}
.t-facultativo{background:var(--amber-50);color:var(--amber);border-color:transparent}
.t-comemorativa{background:var(--primary-50);color:var(--primary-700);border-color:transparent}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.d-feriado{background:var(--coral)} .d-municipal{background:var(--primary-700)} .d-local{background:var(--indigo)} .d-facultativo{background:var(--amber)} .d-comemorativa{background:var(--primary)}
.s-ideia{background:#EEF2F1;color:#5F7B76} .s-producao{background:var(--amber-50);color:var(--amber)} .s-aprovacao{background:var(--indigo-50);color:var(--indigo)} .s-agendado{background:var(--primary-50);color:var(--primary-700)} .s-publicado{background:var(--primary-700);color:#fff}
.s-aberta{background:#EEF2F1;color:#5F7B76} .s-concluida{background:var(--primary-700);color:#fff}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--primary-100);color:var(--primary-700);font-size:11px;font-weight:700;display:inline-grid;place-items:center}

/* Lists */
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.datebox{width:44px;flex:none;text-align:center;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);padding:4px 0;line-height:1.1}
.datebox b{display:block;font-size:17px}
.datebox span{font-size:10.5px;text-transform:uppercase;color:var(--muted);letter-spacing:.04em}
.datebox.today{background:var(--primary);border-color:var(--primary);color:#fff}
.datebox.today span{color:#E8FFFB}

/* Hoje */
.hoje{background:linear-gradient(135deg,#E3F6F2 0%,#F4FBF9 60%,#fff 100%);border:1px solid var(--primary-100);border-radius:18px;padding:22px 24px;margin-bottom:16px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:start}
.hoje h2{font-size:13px;color:var(--primary-700);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.hoje-item{margin-bottom:10px}
.hoje-item b{font-size:18px;letter-spacing:-.01em}
.hoje-item p{margin:2px 0 0;color:var(--muted)}
.camp{display:flex;flex-wrap:wrap;gap:6px}
.camp .pill{background:#fff}

/* Calendar */
.cal-wrap{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
.cal-nav{display:flex;align-items:center;gap:6px}
.cal-nav h2{font-size:18px;min-width:170px;text-align:center;text-transform:capitalize}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.cal-head,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-head div{padding:10px;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}
.cell{min-height:112px;padding:6px 7px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0;background:var(--surface)}
.cell:nth-child(7n){border-right:0}
.cell:hover{background:var(--surface-2)}
.cell.out{background:#FAFCFC}
.cell.out .n{color:var(--faint)}
.cell.sel{box-shadow:inset 0 0 0 2px var(--primary)}
.cell .n{font-size:12.5px;font-weight:600;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.cell.today .n{background:var(--primary);color:#fff}
.cell.fer{background:#FFF9F7}
.ev{font-size:11px;line-height:1.3;padding:2px 6px;border-radius:5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.ev.dt{color:var(--text);padding-left:2px;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ev.dt .dot{display:inline-block;margin-right:4px;vertical-align:1px}
.ev.post{background:var(--primary-50);color:var(--primary-700);font-weight:500}
.ev.post.publicado{background:var(--primary-700);color:#fff}
.ev.dem{background:var(--amber-50);color:var(--amber)}
.ev svg.i{width:11px;height:11px}
.more{font-size:11px;color:var(--muted);padding-left:4px}
.dots{display:none;gap:3px;flex-wrap:wrap}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:30px;padding:0 11px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.chip.on{background:var(--primary-50);border-color:var(--primary-100);color:var(--primary-700);font-weight:600}
.daypanel{position:sticky;top:20px}
.daypanel h3{margin:0 0 2px;font-size:17px}
.dp-sec{margin-top:16px}
.dp-sec>.l{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-bottom:6px}
.dp-item{padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--surface-2)}
.dp-item .t{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dp-item p{margin:4px 0 8px;color:var(--muted);font-size:13px}
.dp-item .acts{display:flex;gap:6px;flex-wrap:wrap}
.tabs{display:inline-flex;background:#E7F0EE;border-radius:10px;padding:3px;gap:2px}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:500;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.tabs button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.07)}
.gframe{width:100%;height:720px;border:0;border-radius:var(--radius);background:var(--surface)}

/* Board */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.inp,.sel{height:36px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);padding:0 11px;outline:none;min-width:0}
.inp:focus,.sel:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-50)}
.search{position:relative;flex:1;max-width:280px;min-width:160px}
.search svg{position:absolute;left:10px;top:9px;color:var(--faint)}
.search .inp{width:100%;padding-left:34px}
.board{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:12px;align-items:start}
.col{background:#EAF2F0;border-radius:var(--radius);padding:10px;min-height:200px;transition:background .15s}
.col.over{background:var(--primary-100)}
.col-h{display:flex;align-items:center;gap:8px;padding:4px 4px 10px;font-weight:600}
.col-h .cnt{color:var(--muted);font-weight:500;font-size:12.5px}
.col-h .icon-btn{margin-left:auto}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:grab;box-shadow:0 1px 2px rgba(17,48,43,.05);overflow:hidden}
.kcard:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.kcard.dragging{opacity:.45}
.kthumb{position:relative;aspect-ratio:16/10;background:var(--surface-2);overflow:hidden}
.kthumb img,.kthumb video{width:100%;height:100%;object-fit:cover;display:block}
.kthumb .cnt{position:absolute;right:8px;top:8px;background:rgba(17,48,43,.7);color:#fff;font-size:11px;padding:2px 7px;border-radius:99px;display:flex;gap:4px;align-items:center}
.kthumb .cnt svg{width:12px;height:12px}
.kbody{padding:10px 12px 12px}
.kbody .t{font-weight:600;margin:6px 0 8px;line-height:1.35}
.kmeta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.kmeta .sp{flex:1}
.ktags{display:flex;gap:5px;flex-wrap:wrap}
.prog{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:9px}
.prog i{display:block;height:100%;background:var(--primary)}
.av{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;flex:none}
.late{color:var(--danger);font-weight:600}

/* Demandas */
.dem-add{display:grid;grid-template-columns:2fr 1fr 1fr 140px 120px auto;gap:8px;margin-bottom:16px}
.dem{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.dem:hover{border-color:var(--line-2)}
.check{width:24px;height:24px;border-radius:50%;border:2px solid var(--line-2);background:none;cursor:pointer;display:grid;place-items:center;flex:none;color:transparent;padding:0}
.check:hover{border-color:var(--primary)}
.check.on{background:var(--primary);border-color:var(--primary);color:#fff}
.check svg{width:14px;height:14px;stroke-width:3}
.dem.done .t{text-decoration:line-through;color:var(--faint)}
.dem .t{font-weight:600}
.dem .meta{font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.prio{width:8px;height:8px;border-radius:50%}
.p-alta{background:var(--danger)} .p-media{background:var(--amber)} .p-baixa{background:var(--line-2)}
.dem .sel{height:30px;font-size:12.5px}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(17,48,43,.28);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100vw);background:var(--surface);box-shadow:var(--shadow-lg);transform:translateX(102%);transition:transform .25s cubic-bezier(.2,.8,.2,1);z-index:41;display:flex;flex-direction:column}
.drawer.on{transform:none}
.dr-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.dr-h h3{margin:0;font-size:16px;flex:1}
.dr-b{flex:1;overflow-y:auto;padding:20px}
.dr-f{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line);align-items:center}
.dr-f .sp{flex:1}
.fld{margin-bottom:16px}
.fld>label,.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
.fld .inp,.fld .sel,.fld textarea{width:100%}
textarea{border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;outline:none;resize:vertical;min-height:84px;background:var(--surface);line-height:1.5}
.title-inp{width:100%;border:0;font-size:20px;font-weight:700;letter-spacing:-.01em;outline:none;padding:4px 0;margin-bottom:12px;background:none}
.title-inp::placeholder{color:var(--faint)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{height:32px;padding:0 12px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--primary-50);border-color:var(--primary);color:var(--primary-700);font-weight:600}
.seg svg.i{width:15px;height:15px}
.drop{border:1.5px dashed var(--line-2);border-radius:12px;padding:18px;text-align:center;color:var(--muted);cursor:pointer;background:var(--surface-2);display:block}
.drop:hover,.drop.over{border-color:var(--primary);background:var(--primary-50);color:var(--primary-700)}
.drop svg{width:22px;height:22px;margin-bottom:4px}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:10px}
.mthumb{position:relative;aspect-ratio:4/5;border-radius:10px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.mthumb img,.mthumb video{width:100%;height:100%;object-fit:cover;display:block}
.mthumb .num{position:absolute;left:6px;top:6px;background:rgba(17,48,43,.72);color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:99px;display:grid;place-items:center;padding:0 5px}
.mthumb .ctl{position:absolute;inset:auto 0 0 0;display:flex;justify-content:space-between;padding:4px;background:linear-gradient(transparent,rgba(17,48,43,.6));opacity:0;transition:opacity .15s}
.mthumb:hover .ctl{opacity:1}
@media (hover:none){.mthumb .ctl{opacity:1}}
.mthumb .ctl button{width:26px;height:26px;border-radius:7px;border:0;background:rgba(255,255,255,.92);cursor:pointer;display:grid;place-items:center;color:var(--text)}
.mthumb .ctl svg{width:14px;height:14px}
.mthumb .vid{position:absolute;right:6px;top:6px;color:#fff;background:rgba(17,48,43,.72);border-radius:99px;width:22px;height:22px;display:grid;place-items:center}
.mthumb .vid svg{width:12px;height:12px}
.clist .ci{display:flex;align-items:center;gap:10px;padding:6px 0}
.clist .ci span{flex:1}
.clist .ci.ok span{text-decoration:line-through;color:var(--faint)}
.clist .check{width:20px;height:20px}
.clist .check svg{width:12px;height:12px}
.note{font-size:12.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:8px;align-items:flex-start}
.note svg{margin-top:1px;color:var(--primary-600)}
.counter{font-size:11.5px;color:var(--faint);text-align:right;margin-top:4px}

/* ===== Nuvem ===== */
const Cloud = {
  sb: null, on: false,
  async init() {
    if (!SB_URL || !SB_KEY) return;
    try {
      await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js');
      this.sb = supabase.createClient(SB_URL, SB_KEY);
      const { data, error } = await this.sb.from('pauta_registros').select('*');
      if (error) throw error;
      // Primeira conexão: o que já existia só neste aparelho sobe para a nuvem
      if (!data.length && ['cards', 'demandas', 'metricas', 'datas'].some(k => S[k].length)) {
        const linhas = [];
        for (const k of ['cards', 'demandas', 'metricas', 'datas']) for (const x of S[k]) linhas.push({ id: x.id, tipo: k, dados: x, atualizado: new Date().toISOString() });
        linhas.push({ id: 'config', tipo: 'config', dados: { id: 'config', ...S.config }, atualizado: new Date().toISOString() });
        await this.sb.from('pauta_registros').upsert(linhas);
        data.push(...linhas);
      }
      const novo = blank(); novo.config = S.config;
      for (const r of data) {
        if (r.tipo === 'config') novo.config = { ...novo.config, ...r.dados };
        else if (novo[r.tipo]) novo[r.tipo].push(r.dados);
      }
      S = novo; this.on = true; persist(); render();
      this.sb.channel('pauta').on('postgres_changes', { event: '*', schema: 'public', table: 'pauta_registros' }, p => this.onChange(p)).subscribe();
      Push.renovar();
    } catch (e) { console.warn(e); toast('Nuvem indisponível — trabalhando neste aparelho'); }
    setSync();
  },
  put(tipo, item) {
    if (!this.on) return;
    this.sb.from('pauta_registros').upsert({ id: item.id, tipo, dados: item, atualizado: new Date().toISOString() })
      .then(({ error }) => { if (error) toast('Falha ao sincronizar'); });
  },
  del(id) { if (this.on) this.sb.from('pauta_registros').delete().eq('id', id).then(() => {}); },
  onChange(p) {
    if (p.eventType === 'DELETE') {
      const id = p.old && p.old.id; if (!id) return;
      for (const k of ['cards', 'demandas', 'metricas', 'datas']) S[k] = S[k].filter(x => x.id !== id);
    } else {
      const r = p.new;
      if (r.tipo === 'config') S.config = { ...S.config, ...r.dados };
      else {
        const arr = S[r.tipo]; if (!arr) return;
        const i = arr.findIndex(x => x.id === r.id);
        if (i >= 0) { if ((arr[i].atualizado || 0) > (r.dados.atualizado || 0)) return; arr[i] = r.dados; } else arr.push(r.dados);
        const d = r.dados;
        if (d.dev !== DEV && d.acao && relevante(d.acao)) avisar(`${d.por || 'Alguém da equipe'} ${d.acao}`, tituloDe(d), r.tipo === 'cards' ? 'quadro' : r.tipo === 'demandas' ? 'demandas' : 'agenda');
      }
    }
    persist(); render();
    if (D && !D.dirty && p.new && p.new.id && p.new.id === D.obj.id && p.new.dados) { D.obj = JSON.parse(JSON.stringify(p.new.dados)); pintarDrawer(); }
  },
};

}

async function avisar(titulo, corpo, destino) {

  if (!document.hidden || !('Notification' in window) || Notification.permission !== 'granted') return;
  try { const reg = await navigator.serviceWorker?.getRegistration(); if (reg) reg.showNotification(titulo, { body: corpo, icon: 'icon-192.png', badge: 'icon-192.png', tag: 'pauta-' + Date.now(), data: { url: './#' + (destino || 'inicio') } }); else new Notification(titulo, { body: corpo, icon: 'icon-192.png' }); } catch (e) {}
}
// Resumo do dia: datas de hoje e de amanhã, posts e prazos — uma vez por dia em cada aparelho
function resumoDoDia() {
  const h = hoje(), am = _iso(new Date(Date.now() + 864e5));
  const partes = [];
  const dh = datasDoDia(h, S.datas), da = datasDoDia(am, S.datas);
  if (dh.length) partes.push('Hoje: ' + dh.map(x => x.nome).join(', '));
  if (da.length) partes.push('Amanhã: ' + da.map(x => x.nome).join(', '));
  const posts = S.cards.filter(c => c.data === h && c.status !== 'publicado');
  if (posts.length) partes.push(`${posts.length} publicação(ões) marcada(s) para hoje`);
  const prazos = S.demandas.filter(d => d.prazo === h && d.status !== 'concluida');
  if (prazos.length) partes.push(`${prazos.length} demanda(s) vencem hoje`);

}
async function lembreteDoDia() {

const VAPID_PUBLIC = 'BF1bFxWEjR3X_h6QfzgfkFm4QMaU33S-FrL7IA26ThiwOftpjMePWNkrqAz6ZFVzcwvFbLtxmcMB7dGwB6ej8P8';
const Push = {
  ativo: localStorage.getItem('pauta_push') === '1',
  suportado() { return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; },
  ehIOS() { return /iphone|ipad|ipod/i.test(navigator.userAgent); },
  instalado() { return matchMedia('(display-mode: standalone)').matches || navigator.standalone; },
  async ativar(silencioso) {
    try {
      if (!this.suportado()) { if (!silencioso) toast(this.ehIOS() && !this.instalado() ? 'No iPhone, adicione o app à Tela de Início primeiro' : 'Este navegador não aceita notificações'); return; }
      if (!Cloud.on) { if (!silencioso) toast('Ligue a nuvem antes de ativar as notificações'); return; }
      const perm = silencioso ? Notification.permission : await Notification.requestPermission();
      if (perm !== 'granted') { if (!silencioso) toast('Permissão de notificação negada'); return; }
      const reg = await navigator.serviceWorker.ready;
      let sub = await reg.pushManager.getSubscription();
      if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ParaBytes(VAPID_PUBLIC) });
      const j = sub.toJSON();
      const { error } = await Cloud.sb.from('pauta_push').upsert({ id: DEV, nome: EU, endpoint: sub.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth, criado: Date.now() });
      if (error) throw error;
      this.ativo = true; localStorage.setItem('pauta_push', '1');
      if (!silencioso) { toast('Notificações ativadas neste aparelho'); render(); }
    } catch (e) { console.error('push', e); if (!silencioso) toast('Não foi possível ativar as notificações'); }
  },
  renovar() { if (this.suportado() && Notification.permission === 'granted') this.ativar(true); },
};
function b64ParaBytes(s) { const p = '='.repeat((4 - s.length % 4) % 4), b = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(b, c => c.charCodeAt(0)); }

/* ===== Mídias (IndexedDB local / Storage na nuvem) ===== */
const IDB = {
  db: null,
  open() { return this.db ? Promise.resolve(this.db) : new Promise((ok, err) => { const r = indexedDB.open('pauta_midias', 1); r.onupgradeneeded = () => r.result.createObjectStore('m'); r.onsuccess = () => ok(this.db = r.result); r.onerror = () => err(r.error); }); },
  async put(k, v) { const db = await this.open(); return new Promise((ok, err) => { const t = db.transaction('m', 'readwrite'); t.objectStore('m').put(v, k); t.oncomplete = ok; t.onerror = () => err(t.error); }); },
  async get(k) { const db = await this.open(); return new Promise(ok => { const r = db.transaction('m').objectStore('m').get(k); r.onsuccess = () => ok(r.result); r.onerror = () => ok(null); }); },
};
function comprimir(file, max = 2000, q = .86) {
  return new Promise(ok => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => { URL.revokeObjectURL(url); ok(b && b.size < file.size ? b : file); }, 'image/jpeg', q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); ok(file); };
    img.src = url;
  });
}
async function guardarArquivos(files) {
  const out = [];
  for (const f of files) {
    const kind = f.type.startsWith('video') ? 'video' : 'image';
    const blob = kind === 'image' && !/gif|svg/.test(f.type) ? await comprimir(f) : f;
    const m = { id: uid(), kind, nome: f.name };
    let subiu = false;
    if (Cloud.on) {
      const ext = (blob.type.split('/')[1] || 'bin').replace('jpeg', 'jpg').replace('quicktime', 'mov');
      const path = `${m.id}.${ext}`;
      const { error } = await Cloud.sb.storage.from('midias').upload(path, blob, { contentType: blob.type });
      if (!error) { m.url = Cloud.sb.storage.from('midias').getPublicUrl(path).data.publicUrl; m.path = path; subiu = true; }
      else toast('Arquivo grande demais para a nuvem — ficou só neste aparelho');
    }
    if (!subiu) { await IDB.put(m.id, blob); m.local = true; }
    out.push(m);
  }
  return out;
}
const _urls = {};
async function midiaURL(m) {
  if (m.url) return m.url;
  if (_urls[m.id]) return _urls[m.id];
  const b = await IDB.get(m.id);
  return b ? (_urls[m.id] = URL.createObjectURL(b)) : '';
}
const MIDIAS = {};
function thumbHTML(m) {
  MIDIAS[m.id] = m;
  return m.kind === 'video'
    ? `<video data-mid="${m.id}" muted playsinline preload="metadata"></video>`
    : `<img data-mid="${m.id}" alt="" loading="lazy">`;
}
function hidratar(root = document) {
  root.querySelectorAll('[data-mid]:not([src])').forEach(async el => {
    const m = MIDIAS[el.dataset.mid]; if (!m) return;
    const u = await midiaURL(m);
    if (u) el.src = m.kind === 'video' && !u.startsWith('blob:') ? u + '#t=0.1' : u;
    else el.closest('.mthumb,.kthumb')?.setAttribute('title', 'Arquivo salvo em outro aparelho');
  });
}

/* ===== AGENDA ===== */
let calMes = (() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); })();
let calSel = hoje();
const calF = { datas: true, posts: true, demandas: true };
function vAgenda() {
  const y = calMes.getFullYear(), m = calMes.getMonth();
  const ini = new Date(y, m, 1 - new Date(y, m, 1).getDay());
  const semanas = Math.ceil((new Date(y, m, 1).getDay() + new Date(y, m + 1, 0).getDate()) / 7);
  const h = hoje();
  const posts = {}, dems = {};
  for (const c of S.cards) if (c.data) (posts[c.data] = posts[c.data] || []).push(c);
  for (const d of S.demandas) if (d.prazo && d.status !== 'concluida') (dems[d.prazo] = dems[d.prazo] || []).push(d);
  let cells = '';
  for (let i = 0; i < semanas * 7; i++) {
    const dt = new Date(ini.getFullYear(), ini.getMonth(), ini.getDate() + i), iso = _iso(dt);
    const ds = calF.datas ? datasDoDia(iso, S.datas) : [];
    const ps = calF.posts ? (posts[iso] || []) : [];
    const de = calF.demandas ? (dems[iso] || []) : [];
    const evs = [
      ...ds.map(x => `<div class="ev dt" title="${esc(x.nome)}"><span class="dot d-${x.tipo}"></span>${esc(x.nome)}</div>`),
      ...ps.map(c => `<div class="ev post ${c.status}" title="${esc(c.titulo)}">${ic(FMT_IC[c.formato] || 'image')}${esc(c.titulo || 'Sem título')}</div>`),
      ...de.map(x => `<div class="ev dem" title="${esc(x.titulo)}">${ic('flag')}${esc(x.titulo)}</div>`),
    ];
    const dots = [...ds.map(x => `<span class="dot d-${x.tipo}"></span>`), ...ps.map(() => '<span class="dot" style="background:var(--primary-600)"></span>'), ...de.map(() => '<span class="dot" style="background:var(--amber)"></span>')].slice(0, 6).join('');
    const fer = ds.some(x => x.tipo === 'feriado' || x.tipo === 'municipal');
    cells += `<div class="cell ${dt.getMonth() !== m ? 'out' : ''} ${iso === h ? 'today' : ''} ${iso === calSel ? 'sel' : ''} ${fer ? 'fer' : ''}" data-act="selDia" data-d="${iso}">
      <span class="n">${dt.getDate()}</span>${evs.slice(0, 4).join('')}${evs.length > 4 ? `<span class="more">+${evs.length - 4}</span>` : ''}<div class="dots">${dots}</div></div>`;
  }
  const camp = CAMPANHAS[m + 1] || [];
  const filtro = (k, n) => `<button class="chip ${calF[k] ? 'on' : ''}" data-act="calFiltro" data-v="${k}">${n}</button>`;

  return `
  <div class="page-h"><div><p class="eyebrow">Calendário editorial</p><h1>Agenda</h1></div>
    <div class="h-actions"><button class="btn primary" data-act="novoCard" data-d="${calSel}">${ic('plus')}Nova pauta</button></div></div>
  <div class="toolbar">
    <div class="cal-nav"><button class="icon-btn" data-act="calMes" data-v="-1" aria-label="Mês anterior">${ic('left')}</button><h2>${MESES[m]} ${y}</h2><button class="icon-btn" data-act="calMes" data-v="1" aria-label="Próximo mês">${ic('right')}</button><button class="btn sm" data-act="calHoje">Hoje</button></div>
    <div style="flex:1"></div>
    <div class="filters">${filtro('datas', 'Datas')}${filtro('posts', 'Publicações')}${filtro('demandas', 'Prazos')}</div>
  </div>
  ${camp.length ? `<div class="camp" style="margin-bottom:12px">${camp.map(([n, t]) => `<span class="pill t-comemorativa">${esc(n)} · ${esc(t)}</span>`).join('')}</div>` : ''}
  <div class="cal-wrap">
    <div class="cal"><div class="cal-head">${['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'].map(x => `<div>${x}</div>`).join('')}</div><div class="cal-grid">${cells}</div></div>
    ${vDia(calSel, posts, dems)}
  </div>`;
}

      <button class="btn sm" data-act="novaData" data-d="${iso}">${ic('flag')}Data da cidade</button>
    </div>
  </aside>`;
}

    if (t === 'check') return `<div class="fld"><label style="display:flex;gap:8px;align-items:center;color:var(--text)"><input type="checkbox" data-f="${k}" ${v ? 'checked' : ''}> ${n}</label></div>`;

    return `<div class="fld"><label>${n}</label><input class="inp" type="${t}" ${t === 'number' ? 'min="0" inputmode="decimal"' : ''} value="${esc(v)}" data-f="${k}"></div>`;
  };
  const cs = F.campos();
  const corpo = cs.map(campo).join('');
  return `<div class="dr-h"><h3>${F.titulo(o)}</h3><button class="icon-btn" data-act="closeDrawer" aria-label="Fechar">${ic('x')}</button></div>
  <div class="dr-b">${F.nota ? `<div class="note" style="margin-bottom:16px">${ic('info')}<span>${F.nota}</span></div>` : ''}${corpo}</div>
  <div class="dr-f">${D.novo ? '' : `<button class="btn danger" data-act="rmForm">${ic('trash')}Excluir</button>`}

    <span class="sp"></span><button class="btn primary" data-act="salvarForm">Salvar</button></div>`;
}

/* ===== Ações ===== */
const ACT = {
  go: a => go(a.dataset.v),
  closeDrawer: () => fecharDrawer(),
  novoCard: a => novoCard({ ...(a.dataset.d ? { data: a.dataset.d } : {}), ...(a.dataset.s ? { status: a.dataset.s } : {}) }),
  abrirCard: a => abrirCard(a.dataset.id),
  pautarData: a => { const ds = datasDoDia(a.dataset.d, S.datas).find(x => x.nome === a.dataset.n); novoCard({ titulo: a.dataset.n, data: a.dataset.d, pilar: 'Datas comemorativas', notas: ds?.dica || '', dataRef: a.dataset.n }); },
  selDia: a => { calSel = a.dataset.d; render(); if (innerWidth <= 1100) $('.daypanel')?.scrollIntoView({ behavior: 'smooth', block: 'start' }); },
  calMes: a => { calMes = new Date(calMes.getFullYear(), calMes.getMonth() + +a.dataset.v, 1); render(); },
  calHoje: () => { const d = new Date(); calMes = new Date(d.getFullYear(), d.getMonth(), 1); calSel = hoje(); render(); },
  calFiltro: a => { calF[a.dataset.v] = !calF[a.dataset.v]; render(); },
  setFmt: a => {
    const c = D.obj, intacto = c.checklist.every(x => !x.ok) && JSON.stringify(c.checklist.map(x => x.t)) === JSON.stringify(CHECK_PADRAO[c.formato] || []);
    c.formato = a.dataset.v; if (intacto) c.checklist = CHECK_PADRAO[c.formato].map(t => ({ t, ok: false }));
    D.dirty = true; pintarDrawer();
  },
  tgCheck: a => { const x = D.obj.checklist[+a.dataset.i]; x.ok = !x.ok; D.dirty = true; pintarDrawer(); },
  rmCheck: a => { D.obj.checklist.splice(+a.dataset.i, 1); D.dirty = true; pintarDrawer(); },
  addCheck: () => { const v = $('#newCheck').value.trim(); if (!v) return; D.obj.checklist.push({ t: v, ok: false }); D.dirty = true; pintarDrawer(); $('#newCheck')?.focus(); },
  mvMidia: a => { const i = +a.dataset.i, j = i + +a.dataset.v, m = D.obj.midias; if (j < 0 || j >= m.length) return; [m[i], m[j]] = [m[j], m[i]]; D.dirty = true; pintarDrawer(); },
  rmMidia: a => { if (!confirm('Remover esta mídia da pauta?')) return; D.obj.midias.splice(+a.dataset.i, 1); D.dirty = true; pintarDrawer(); },
  abrirMidia: async a => { const u = await midiaURL(D.obj.midias[+a.dataset.i]); if (u) window.open(u, '_blank', 'noopener'); else toast('Arquivo salvo em outro aparelho'); },
  salvarCard: () => {
    const c = D.obj; if (!c.titulo.trim()) { toast('Dê um título para a pauta'); $('#drawer .title-inp')?.focus(); return; }
    if (c.status === 'publicado' && !c.data) c.data = hoje();
    upsert('cards', c); D.dirty = false; fecharDrawer(true); toast('Pauta salva');
  },
  rmCard: () => { if (!confirm('Excluir esta pauta?')) return; removeItem('cards', D.obj.id); fecharDrawer(true); toast('Pauta excluída'); },
  novaDemanda: () => abrirForm('demanda', { id: uid(), titulo: '', status: 'aberta', prioridade: 'media', criado: Date.now() }, true),
  editarDemanda: a => { const d = S.demandas.find(x => x.id === a.dataset.id); if (d) abrirForm('demanda', d, false); },
  tgDemanda: a => { const d = S.demandas.find(x => x.id === a.dataset.id); if (!d) return; const ok = d.status !== 'concluida'; upsert('demandas', { ...d, status: ok ? 'concluida' : 'aberta', concluido: ok ? Date.now() : null }); if (ok) toast('Demanda concluída'); },
  demTab: a => { demTab = a.dataset.v; render(); },
  virarPauta: a => {
    const d = S.demandas.find(x => x.id === a.dataset.id); if (!d) return;
    if (d.status === 'aberta') upsert('demandas', { ...d, status: 'producao' });
    if (D) fecharDrawer(true);
    novoCard({ titulo: d.titulo, notas: [d.desc, d.secretaria ? 'Solicitante: ' + d.secretaria : ''].filter(Boolean).join('\n'), resp: d.resp || '', status: 'producao', demandaId: d.id, data: d.prazo || '' });
  },
  novaData: a => abrirForm('data', { id: uid(), nome: '', data: a.dataset.d || hoje(), anual: true, tipo: 'local', dica: '' }, true),
  editarData: a => { const d = S.datas.find(x => x.id === a.dataset.id); if (d) abrirForm('data', d, false); },
  salvarForm: () => {
    const F = FORMS[D.tipo], o = { ...D.obj }; delete o._novo;
    if (D.tipo === 'demanda' && !o.titulo?.trim()) return toast('Descreva a demanda');
    if (D.tipo === 'data' && (!o.nome?.trim() || !o.data)) return toast('Preencha nome e data');
    if (D.tipo === 'demanda') o.concluido = o.status === 'concluida' ? (o.concluido || Date.now()) : null;
    upsert(F.col, o); fecharDrawer(true); toast('Salvo');
  },
  rmForm: () => { if (!confirm('Excluir?')) return; removeItem(FORMS[D.tipo].col, D.obj.id); fecharDrawer(true); },
  usarIdeia: a => { const i = IDEIAS.find(x => x[0] === a.dataset.t); novoCard({ titulo: i[0], formato: FMT_IC[i[1]] ? i[1] : 'Reels', pilar: PILARES.includes(i[2]) ? i[2] : '', notas: i[4] }); },
  ideiaPilar: a => { ideiaPilar = a.dataset.v; render(); },
  rmMembro: a => { S.config.equipe = S.config.equipe.filter(e => e.id !== a.dataset.id); saveConfig(); render(); },
  atividade: () => abrirAtividade(),
  abrirAtiv: a => { const col = a.dataset.col, id = a.dataset.id; fecharDrawer(true); if (col === 'cards') abrirCard(id); else if (col === 'demandas') ACT.editarDemanda(a); else ACT.editarData(a); },
  trocarEu: () => abrirEu(),
  escolherEu: a => definirEu(a.dataset.v),
  ativarPush: () => Push.ativar(false),
  testarAviso: async () => { if (!('Notification' in window) || Notification.permission !== 'granted') return toast('Ative as notificações primeiro'); const reg = await navigator.serviceWorker?.getRegistration(); const p = resumoDoDia(); const corpo = p.join(' · ') || 'As notificações estão funcionando.'; reg ? reg.showNotification('Ney Hub · Hoje', { body: corpo, icon: 'icon-192.png', tag: 'pauta-teste' }) : new Notification('Ney Hub · Hoje', { body: corpo }); },
  exportarJSON: () => { baixar(new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' }), `ney-hub-backup-${hoje()}.json`); },
  importarJSON: () => $('#jsonIn').click(),
};
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  if (_arrastou && a.classList.contains('kcard')) return;
  const f = ACT[a.dataset.act]; if (!f) return;
  if (a.tagName === 'BUTTON' || a.tagName === 'A') e.preventDefault();
  e.stopPropagation(); f(a, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && D) fecharDrawer();
  if (e.key === 'Enter' && e.target.id === 'newCheck') { e.preventDefault(); ACT.addCheck(); }
});

/* Campos editáveis */
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.f && D && t.closest('#drawer')) {
    const v = t.type === 'checkbox' ? t.checked : t.value;
    const [a, b] = t.dataset.f.split('.');
    if (b) { D.obj[a] = D.obj[a] || {}; D.obj[a][b] = v; } else D.obj[a] = v;
    D.dirty = true;
    if (a === 'legenda') { const n = (v.match(/#[\p{L}\d_]+/gu) || []).length; $('#legCount').textContent = `${v.length}/2.200 caracteres · ${n} hashtags`; }
  }
  if (t.dataset.q === 'q') { Q.q = t.value; const pos = t.selectionStart; render(); const n = $('[data-q="q"]'); n.focus(); n.setSelectionRange(pos, pos); }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset.f && D && t.closest('#drawer')) {
    if (t.dataset.f === 'status' || t.dataset.f === 'data') pintarDrawer();
  }
  if (t.dataset.q === 'fmt' || t.dataset.q === 'resp') { Q[t.dataset.q] = t.value; render(); }
  if (t.dataset.dst) { const d = S.demandas.find(x => x.id === t.dataset.dst); if (d) upsert('demandas', { ...d, status: t.value, concluido: t.value === 'concluida' ? Date.now() : null }); }
  if (t.dataset.cfg) { S.config[t.dataset.cfg] = t.value.trim().replace(/^@/, ''); saveConfig(); toast('Configuração salva'); }
  if (t.matches('[data-upload]')) { await anexar([...t.files]); t.value = ''; }
  if (t.id === 'jsonIn' && t.files[0]) {
    try {
      const d = JSON.parse(await t.files[0].text());
      if (!d.cards || !d.demandas) throw 0;
      if (!confirm('Substituir os dados atuais pelo backup?')) return;
      S = { ...blank(), ...d, config: { ...blank().config, ...d.config } }; persist();
      if (Cloud.on) { for (const k of ['cards', 'demandas', 'metricas', 'datas']) S[k].forEach(x => Cloud.put(k, x)); saveConfig(); }
      render(); toast('Backup importado');
    } catch (err) { toast('Arquivo de backup inválido'); }
    t.value = '';
  }
});
document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  const v = Object.fromEntries(new FormData(f));
  if (f.dataset.form === 'demRapida') { upsert('demandas', { id: uid(), titulo: v.titulo.trim(), secretaria: v.secretaria.trim(), resp: v.resp.trim(), prazo: v.prazo, prioridade: v.prioridade, status: 'aberta', criado: Date.now() }); toast('Demanda adicionada'); setTimeout(() => $('[data-form="demRapida"] [name="titulo"]')?.focus(), 0); }
  if (f.dataset.form === 'eu') definirEu(v.nome);
  if (f.dataset.form === 'membro') { S.config.equipe.push({ id: uid(), nome: v.nome.trim(), funcao: v.funcao.trim() }); saveConfig(); render(); }
});
async function anexar(files) {
  if (!files.length || !D || D.tipo !== 'card') return;
  toast(`Enviando ${files.length} arquivo(s)…`);
  try { const ms = await guardarArquivos(files); D.obj.midias.push(...ms); D.dirty = true; pintarDrawer(); toast('Mídia adicionada'); }
  catch (err) { console.error(err); toast('Não consegui salvar o arquivo'); }
}

/* Arrastar: cards entre colunas e arquivos na área de upload */
let _arrastou = false;
document.addEventListener('dragstart', e => { const k = e.target.closest?.('.kcard'); if (!k) return; _arrastou = true; e.dataTransfer.setData('text/card', k.dataset.card); e.dataTransfer.effectAllowed = 'move'; k.classList.add('dragging'); });
document.addEventListener('dragend', e => { e.target.closest?.('.kcard')?.classList.remove('dragging'); document.querySelectorAll('.col.over').forEach(c => c.classList.remove('over')); setTimeout(() => _arrastou = false, 50); });
document.addEventListener('dragover', e => {
  const col = e.target.closest?.('.col'), drop = e.target.closest?.('[data-drop]');
  if (col && e.dataTransfer.types.includes('text/card')) { e.preventDefault(); document.querySelectorAll('.col.over').forEach(c => c !== col && c.classList.remove('over')); col.classList.add('over'); }
  if (drop && e.dataTransfer.types.includes('Files')) { e.preventDefault(); drop.classList.add('over'); }
});
document.addEventListener('dragleave', e => { const d = e.target.closest?.('[data-drop]'); if (d && !d.contains(e.relatedTarget)) d.classList.remove('over'); });
document.addEventListener('drop', e => {
  const col = e.target.closest?.('.col'), drop = e.target.closest?.('[data-drop]');
  if (col && e.dataTransfer.types.includes('text/card')) {
    e.preventDefault(); const id = e.dataTransfer.getData('text/card'), c = S.cards.find(x => x.id === id);
    if (c && c.status !== col.dataset.col) { const n = { ...c, status: col.dataset.col }; if (n.status === 'publicado' && !n.data) n.data = hoje(); upsert('cards', n); toast(`Movida para ${COL_NOME[n.status]}`); }
  }
  if (drop) { e.preventDefault(); drop.classList.remove('over'); anexar([...e.dataTransfer.files].filter(f => /^(image|video)\//.test(f.type))); }
});
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (v && v !== view) { view = v; render(); } });

/* ===== Início ===== */
render();
setSync();
Cloud.init().then(() => { lembreteDoDia(); if (!EU && (Cloud.on || S.config.equipe.length)) abrirEu(); });
setInterval(renderNav, 60000);
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').then(r => r.update()).catch(() => {});
  let recarregou = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!recarregou) { recarregou = true; location.reload(); } });
}
</script>
</body>
