<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ney Hub mudou de endereço</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#041A17">
<link rel="icon" href="favicon.png" type="image/png">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#041A17;color:#ECF8F4;font:15px/1.5 system-ui,-apple-system,sans-serif;text-align:center;padding:24px}
  img{width:72px;height:72px;margin-bottom:16px}
  a{color:#34E3B8;font-weight:600}
</style>
</head>
<body>
<div><img src="logo-nh.png" alt=""><h1 style="font-size:20px;margin:0 0 8px">O Ney Hub mudou de endereço</h1>
<p>Levando você para <a id="ir" href="https://neyhub.netlify.app/">neyhub.netlify.app</a>…</p></div>
<script>
// Endereço antigo: desliga o app e as notificações registradas aqui e leva para o novo endereço.
const NOVO = 'https://neyhub.netlify.app/' + location.hash;
document.getElementById('ir').href = NOVO;
(async () => {
  try {
    const dev = localStorage.getItem('pauta_dev');
    if (dev) await fetch('https://ratbwymeytcomgbdhgfo.supabase.co/rest/v1/pauta_push?id=eq.' + encodeURIComponent(dev), { method: 'DELETE', headers: { apikey: 'sb_publishable_8OmH3PiDfgJeBQarYmF8cQ_V-2CLi5o' } });
    if ('serviceWorker' in navigator) for (const r of await navigator.serviceWorker.getRegistrations()) {
      const s = await r.pushManager?.getSubscription(); if (s) await s.unsubscribe();
      await r.unregister();
    }
    if (window.caches) for (const k of await caches.keys()) await caches.delete(k);
  } catch (e) {}
  location.replace(NOVO);
})();
setTimeout(() => location.replace(NOVO), 4000);
</script>
</body>
</html>
